AWSTemplateFormatVersion: '2010-09-09'
Description: BYOL challenge — Node.js Express on Lambda (Pure CloudFormation Version - HH2609)

Resources:
  ExpressFunctionRoleHH2609:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ExpressFunctionHH2609:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: byol-node-express-hh2609
      Handler: lambda.handler
      Runtime: nodejs22.x
      Code: ./
      MemorySize: 512
      Timeout: 10
      Role: !GetAtt ExpressFunctionRoleHH2609.Arn
      Architectures:
        - arm64

  ExpressHttpApiHH2609:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: byol-node-express-hh2609-api
      ProtocolType: HTTP

  ExpressHttpApiStageHH2609:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ExpressHttpApiHH2609
      StageName: '$default'
      AutoDeploy: true

  ExpressHttpApiIntegrationHH2609:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExpressHttpApiHH2609
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ExpressFunctionHH2609.Arn
      PayloadFormatVersion: '2.0'

  ExpressHttpApiRouteHH2609:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExpressHttpApiHH2609
      RouteKey: 'ANY /{proxy+}'
      Target: !Join [ '/', [ 'integrations', !Ref ExpressHttpApiIntegrationHH2609 ] ]

  ExpressHttpApiRootRouteHH2609:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExpressHttpApiHH2609
      RouteKey: 'ANY /'
      Target: !Join [ '/', [ 'integrations', !Ref ExpressHttpApiIntegrationHH2609 ] ]

  ExpressLambdaPermissionHH2609:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExpressFunctionHH2609
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExpressHttpApiHH2609}/*/*

Outputs:
  ApiUrl:
    Value: !Sub https://${ExpressHttpApiHH2609}.execute-api.${AWS::Region}.amazonaws.com
